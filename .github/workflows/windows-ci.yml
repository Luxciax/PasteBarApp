name: Windows CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Disable local Windows signing for CI
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.release.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.tauri.bundle.windows.certificateThumbprint = $null
          $config.tauri.bundle.windows.timestampUrl = $null
          $config.tauri.bundle.targets = @("nsis")
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding UTF8

      - name: Build Windows NSIS
        run: npm run app:build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PasteBar-Windows-CI
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
